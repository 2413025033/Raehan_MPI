<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alur Input</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* CSS KAMU — TIDAK DIUBAH */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;color:white;}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at bottom left,#0b2a4a,#061a33 70%);z-index:-3;}
.orb{position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(0,200,255,.08);filter:blur(12px);animation:floatSmooth 6s ease-in-out infinite;z-index:-2;}
.o1{bottom:-30px;left:-20px;}
.o2{top:20%;right:10%;animation-delay:2s;}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;animation:blink 2s infinite alternate;z-index:-1;}
@keyframes blink{from{opacity:.2;}to{opacity:1;}}
@keyframes floatSmooth{0%{transform:translateY(0);}50%{transform:translateY(-12px);}100%{transform:translateY(0);}}
header{text-align:center;margin-top:40px;font-size:28px;font-weight:700;letter-spacing:1px;text-shadow:0 0 10px rgba(95,208,255,.4);}
.top-btn{position:absolute;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);font-size:20px;color:white;box-shadow:0 0 15px rgba(0,200,255,0.2);transition:0.2s;}
.top-btn:hover{transform:scale(1.1);background:rgba(255,255,255,0.15);}
.back{top:25px;left:25px;}
.sound{top:25px;right:25px;}
.content{width:100%;height:100vh;position:relative;}
.simulation{display:flex;justify-content:center;align-items:center;gap:35px;margin-top:70px;}
.device-box{width:130px;height:130px;border-radius:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:inset 0 0 20px rgba(255,255,255,.12),0 0 20px rgba(0,200,255,.25);animation:floatSmooth 5s ease-in-out infinite;}
.device-icon{font-size:55px;}
.device-text{margin-top:8px;font-size:15px;}
.flow-line{position:relative;width:220px;height:10px;}
.line{position:absolute;top:50%;left:0;width:100%;height:4px;border-radius:20px;background:rgba(255,255,255,.2);transform:translateY(-50%);}
.data{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#5fd0ff;transform:translateY(-50%);box-shadow:0 0 12px #5fd0ff;animation:dataMove 2s linear infinite;}
.data2{animation-delay:.7s;}
.data3{animation-delay:1.4s;}
.computer-box{width:180px;height:130px;border-radius:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:center;box-shadow:inset 0 0 20px rgba(255,255,255,.12),0 0 20px rgba(0,200,255,.25);animation:pulse 2s infinite;}
.screen{padding:18px 45px;border-radius:16px;background:linear-gradient(45deg,#1f7bff,#47b2ff);font-size:24px;font-weight:700;box-shadow:0 0 20px rgba(31,123,255,.5);}
.desc{width:70%;margin:45px auto 0;text-align:center;font-size:16px;line-height:1.8;}
.input-card-wrap{display:flex;justify-content:center;gap:35px;margin-top:45px;}
.input-card{width:120px;padding:18px 12px;border-radius:22px;text-align:center;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);box-shadow:inset 0 0 20px rgba(255,255,255,.1),0 0 18px rgba(0,200,255,.2);animation:floatSmooth 6s ease-in-out infinite;}
.card-icon{font-size:42px;margin-bottom:10px;}
.input-card span{font-size:15px;}
.next-btn{position:absolute;bottom:30px;right:30px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);font-size:20px;color:white;box-shadow:0 0 15px rgba(0,200,255,0.2);transition:0.2s;}
.next-btn:hover{transform:scale(1.1);background:rgba(255,255,255,0.15);}
@keyframes dataMove{0%{left:0;opacity:0;}20%{opacity:1;}100%{left:100%;opacity:0;}}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
</style>
</head>

<body>

<div class="overlay"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="top-btn back" onclick="goBack()">⬅</div>
<div class="top-btn sound" onclick="toggleSound()">♪</div>

<header>ALUR INPUT</header>

<div class="content">
    <div class="simulation">
        <div class="device-box">
            <div class="device-icon">⌨️</div>
            <div class="device-text">Keyboard</div>
        </div>

        <div class="flow-line">
            <div class="line"></div>
            <div class="data"></div>
            <div class="data data2"></div>
            <div class="data data3"></div>
        </div>

        <div class="computer-box">
            <div class="screen">INPUT</div>
        </div>
    </div>

    <div class="desc">
        Ketika pengguna mengetik di keyboard,
        mengklik mouse, atau berbicara melalui mikrofon,
        data akan dikirim masuk ke komputer
        sebagai <b>input</b>.
        <br><br>
        Setelah data diterima,
        komputer akan memproses informasi tersebut
        untuk menghasilkan output.
    </div>

    <div class="input-card-wrap">
        <div class="input-card"><div class="card-icon">⌨️</div><span>Keyboard</span></div>
        <div class="input-card"><div class="card-icon">🖱️</div><span>Mouse</span></div>
        <div class="input-card"><div class="card-icon">🎤</div><span>Mikrofon</span></div>
    </div>
</div>

<button class="next-btn" onclick="nextPage()">➜</button>

<script>
function goBack(){
    window.location.href="materi.html";
}

function nextPage(){
    window.location.href="alur_proses.html";
}

/* ===== MUSIC GLOBAL ===== */
let music;

function initMusic(){
    if(window.musicGlobal){
        music = window.musicGlobal;
    }else{
        music = new Audio("assets/audio/music.mp3"); // SESUAIKAN PATH
        music.loop = true;
        window.musicGlobal = music;
    }

    let status = localStorage.getItem("sound") || "on";
    updateIcon(status);
}

function toggleSound(){
    let status = localStorage.getItem("sound") || "on";

    if(status === "on"){
        music.pause();
        localStorage.setItem("sound","off");
        updateIcon("off");
    }else{
        music.play().catch(()=>{});
        localStorage.setItem("sound","on");
        updateIcon("on");
    }
}

function updateIcon(status){
    document.querySelector(".sound").innerText =
        status === "on" ? "🔇" : "♪";
}

/* trigger supaya bunyi */
document.body.addEventListener("click", () => {
    if(localStorage.getItem("sound") !== "off"){
        music.play().catch(()=>{});
    }
},{once:true});

window.addEventListener("load", initMusic);

/* STAR */
for(let i=0;i<50;i++){
    let star=document.createElement("div");
    star.classList.add("star");
    star.style.top=Math.random()*window.innerHeight+"px";
    star.style.left=Math.random()*window.innerWidth+"px";
    document.body.appendChild(star);
}
</script>

</body>
</html>
