<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soal 1</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    color:white;
}

/* BACKGROUND */
.overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at bottom left,#0b2a4a,#061a33 70%);
    z-index:-3;
}

/* ORB */
.orb{
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(0,200,255,.08);
    filter:blur(12px);
    animation:floatSmooth 6s ease-in-out infinite;
    z-index:-2;
}

.o1{ bottom:-30px; left:-20px; }
.o2{ top:20%; right:10%; animation-delay:2s; }

/* STAR */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
    z-index:-1;
}

@keyframes blink{
from{opacity:.2;}
to{opacity:1;}
}

@keyframes floatSmooth{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

/* HEADER */
header{
    text-align:center;
    margin-top:30px;
    font-size:26px;
    font-weight:700;
    letter-spacing:1px;
    text-shadow:0 0 10px rgba(95,208,255,.4);
}

/* BUTTON */
.top-btn{
    position:absolute;
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    font-size:20px;
    color:white;
    box-shadow:0 0 15px rgba(0,200,255,0.2);
    transition:0.2s;
}

.top-btn:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.15);
}

.back{ top:20px; left:20px; }
.sound{ top:20px; right:20px; }

/* CONTAINER */
.container{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* QUESTION */
.question-box{
    width:80%;
    max-width:700px;
    margin-top:70px;
    text-align:center;
    font-size:20px;
    line-height:1.7;
    animation:floatSmooth 5s ease-in-out infinite;
}

/* OPTION AREA */
.option-area{
    margin-top:70px;
    display:grid;
    grid-template-columns:repeat(2,220px);
    gap:35px 70px;
}

/* OPTION */
.option{
    height:75px;
    display:flex;
    align-items:center;
    padding-left:25px;
    border-radius:40px;
    cursor:pointer;
    background:linear-gradient(180deg,#8c6dff,#6949df);
    box-shadow:
    inset 0 4px 10px rgba(255,255,255,.18),
    inset 0 -4px 10px rgba(0,0,0,.2),
    0 0 18px rgba(120,100,255,.35);
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.option::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.15);
    transition:.4s;
}

.option:hover::before{ left:100%; }
.option:hover{ transform:scale(1.05); }

.option span{
    font-size:28px;
    font-weight:700;
    margin-right:14px;
}

.option p{
    margin:0;
    font-size:22px;
    font-weight:600;
}

@media(max-width:700px){
.option-area{ grid-template-columns:1fr; gap:25px; }
.option{ width:250px; }
}
</style>
</head>

<body>

<div class="overlay"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<!-- BUTTON -->
<div class="top-btn back" onclick="goBack()">⬅</div>
<div class="top-btn sound" onclick="toggleSound()">♪</div>

<header>SOAL 1</header>

<div class="container">

<div class="question-box">
Tahap ketika data pertama kali dimasukkan
ke dalam komputer disebut...
</div>

<div class="option-area">

<div class="option" onclick="wrongAnswer()">
<span>A.</span>
<p>Proses</p>
</div>

<div class="option" onclick="correctAnswer()">
<span>B.</span>
<p>Input</p>
</div>

<div class="option" onclick="wrongAnswer()">
<span>C.</span>
<p>Penyimpanan</p>
</div>

<div class="option" onclick="wrongAnswer()">
<span>D.</span>
<p>Output</p>
</div>

</div>

</div>

<script>
function goBack(){
    window.location.href="kuis.html";
}

/* ===== MUSIC KHUSUS HALAMAN INI ===== */
let music = new Audio("assets/audio/kuis.mp3");
music.loop = true;

let isPlaying = false;

window.addEventListener("load", () => {
    music.play().then(()=>{
        isPlaying = true;
        document.querySelector(".sound").innerText = "🔇";
    }).catch(()=>{});
});

function toggleSound(){
    if(isPlaying){
        music.pause();
        isPlaying = false;
        document.querySelector(".sound").innerText = "♪";
    }else{
        music.play().catch(()=>{});
        isPlaying = true;
        document.querySelector(".sound").innerText = "🔇";
    }
}

/* JAWABAN */
function correctAnswer(){
    window.location.href="benar2.html";
}

function wrongAnswer(){
    window.location.href="salah.html";
}

/* STAR */
for(let i=0;i<50;i++){
let star=document.createElement("div");
star.classList.add("star");
star.style.top=Math.random()*window.innerHeight+"px";
star.style.left=Math.random()*window.innerWidth+"px";
document.body.appendChild(star);
}
</script>

</body>
</html>
