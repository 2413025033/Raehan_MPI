<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contoh Output</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:'Poppins',sans-serif;
color:white;
overflow:hidden;
}

/* BACKGROUND */
.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle at bottom,#0b2a4a,#061a33);
z-index:-2;
}

/* ORB */
.orb{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(0,200,255,.08);
filter:blur(10px);
animation:floatSmooth 6s ease-in-out infinite;
z-index:-1;
}

.o1{top:18%;left:10%;}
.o2{top:65%;right:15%;animation-delay:2s;}
.o3{top:80%;left:45%;animation-delay:4s;}

@keyframes floatSmooth{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* STAR */
.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:blink 2s infinite alternate;
z-index:-1;
}

@keyframes blink{
from{opacity:.2;}
to{opacity:1;}
}

/* HEADER */
header{
text-align:center;
margin-top:60px;
font-size:32px;
font-weight:700;
letter-spacing:2px;
animation:floatSmooth 4s ease-in-out infinite;
text-shadow:0 0 10px rgba(95,208,255,.4);
}

/* TOP BUTTON */
.top-btn{
position:absolute;
top:20px;
width:45px;
height:45px;
display:flex;
justify-content:center;
align-items:center;
border-radius:12px;
cursor:pointer;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
font-size:18px;
color:white;
box-shadow:0 0 15px rgba(0,200,255,.2);
animation:floatSmooth 3.5s ease-in-out infinite;
}

.top-btn:hover{
transform:scale(1.08);
}

.back{left:20px;}
.sound{right:20px;}

/* CONTAINER */
.container{
position:relative;
width:100%;
height:75vh;
}

/* BUBBLE */
.bubble{
width:150px;
height:150px;
border-radius:50%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
display:flex;
justify-content:center;
align-items:center;
position:absolute;
cursor:pointer;
animation:floatSmooth 6s ease-in-out infinite;
box-shadow:
inset 0 0 20px rgba(255,255,255,.2),
0 0 20px rgba(0,200,255,.3);
transition:.3s;
}

.bubble:hover{
transform:scale(1.08);
}

.icon{
font-size:46px;
}

.bubble span{
position:absolute;
bottom:-38px;
font-size:15px;
text-decoration:underline;
}

/* POSISI */
.b1{top:120px;left:20%;}
.b2{top:120px;right:20%;}
.b3{top:330px;left:30%;}
.b4{top:330px;right:30%;}

/* BACK MENU BUTTON */
.back-menu{
position:absolute;
bottom:30px;
left:30px;
padding:12px 18px;
border-radius:12px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
cursor:pointer;
font-size:14px;
box-shadow:0 0 15px rgba(0,200,255,0.2);
transition:.2s;
}

.back-menu:hover{
transform:scale(1.05);
background:rgba(255,255,255,.15);
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="top-btn back" onclick="goBack()">←</div>
<div class="top-btn sound" onclick="toggleSound()">♪</div>

<header>Contoh Perangkat Output</header>

<div class="container">

<div class="bubble b1">
<div class="icon">🖥️</div>
<span>Monitor</span>
</div>

<div class="bubble b2">
<div class="icon">🖨️</div>
<span>Printer</span>
</div>

<div class="bubble b3">
<div class="icon">🔊</div>
<span>Speaker</span>
</div>

<div class="bubble b4">
<div class="icon">🎧</div>
<span>Headphone</span>
</div>

</div>

<!-- BALIK KE MENU -->
<div class="back-menu" onclick="goMenu()">
⬅ Balik ke Pilih Materi
</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function goBack(){
window.location.href="fungsi/fungsi_output.html";
}

function goMenu(){
window.location.href="materi.html";
}

let isPlaying=false;
let music=document.getElementById("music");

function toggleSound(){
if(isPlaying){
music.pause();
isPlaying=false;
document.querySelector(".sound").innerText="♪";
}else{
music.play();
isPlaying=true;
document.querySelector(".sound").innerText="🔇";
}
}

/* stars */
for(let i=0;i<50;i++){
let star=document.createElement("div");
star.classList.add("star");
star.style.top=Math.random()*window.innerHeight+"px";
star.style.left=Math.random()*window.innerWidth+"px";
document.body.appendChild(star);
}
</script>

</body>
</html>
