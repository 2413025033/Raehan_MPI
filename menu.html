<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu IPO Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow: hidden;
}

/* BACKGROUND */
.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at bottom, #0b2a4a, #061a33);
    z-index: -10;
    pointer-events: none;
}

/* STAR */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: blink 2s infinite alternate;
    z-index: -9;
    pointer-events: none;
}

@keyframes blink {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* FLOAT */
@keyframes floatSmooth {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

/* TITLE */
h1 {
    text-align: center;
    margin-top: 25px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    animation: floatSmooth 4s ease-in-out infinite;
    text-shadow: 0 0 10px rgba(95, 208, 255, 0.4);
}

/* TOP BUTTON */
.top-btn {
    position: absolute;
    top: 20px;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: white;
    font-size: 18px;
    box-shadow: 0 0 15px rgba(0,200,255,0.2);
    transition: 0.2s;
    z-index: 9999;
}

.top-btn:hover {
    transform: scale(1.1);
    background: rgba(255,255,255,0.15);
}

.back { left: 20px; }
.sound { right: 20px; }

/* CONTAINER */
.container {
    position: relative;
    width: 100%;
    height: 100vh;
}

/* BUBBLE */
.bubble {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    cursor: pointer;
    animation: floatSmooth 6s ease-in-out infinite;
    box-shadow:
        inset 0 0 20px rgba(255,255,255,0.2),
        0 0 20px rgba(0, 200, 255, 0.3);
    transition: 0.3s;
}

.bubble:hover {
    transform: scale(1.1);
}

.icon {
    font-size: 40px;
}

.bubble span {
    position: absolute;
    bottom: -40px;
    font-size: 14px;
    text-decoration: underline;
}

/* POSISI */
.b1 { top: 120px; left: 20%; }
.b2 { top: 120px; left: 45%; }
.b3 { top: 120px; right: 20%; }
.b4 { top: 300px; left: 32%; }
.b5 { top: 300px; right: 32%; }
</style>
</head>

<body>

<div class="overlay"></div>

<!-- BUTTON -->
<div class="top-btn back" onclick="goBack()">⬅</div>
<div class="top-btn sound" onclick="toggleSound()">♪</div>

<h1>MENU</h1>

<div class="container">

    <div class="bubble b1" onclick="window.location.href='tujuan.html'">
        <div class="icon">🎓</div>
        <span>Tujuan</span>
    </div>

    <div class="bubble b2" onclick="window.location.href='materi.html'">
        <div class="icon">📖</div>
        <span>Materi</span>
    </div>

    <div class="bubble b3" onclick="window.location.href='tentang.html'">
        <div class="icon">ℹ️</div>
        <span>Tentang</span>
    </div>

    <div class="bubble b4" onclick="window.location.href='petunjuk.html'">
        <div class="icon">💡</div>
        <span>Petunjuk</span>
    </div>

    <div class="bubble b5" onclick="window.location.href='kuis.html'">
        <div class="icon">❓</div>
        <span>Kuis</span>
    </div>

</div>

<!-- 🔊 AUDIO (INI YANG DIPAKE SAMA sound.js) -->
<audio id="music" loop preload="auto">
    <source src="assets/audio/music.mp3" type="audio/mpeg">
</audio>

<!-- JS NAVIGATION ONLY (TANPA LOGIC MUSIC BIAR TIDAK BENTROK) -->
<script>
function goBack() {
    window.location.href = "index.html";
}

// STAR GENERATOR
for (let i = 0; i < 40; i++) {
    let star = document.createElement("div");
    star.classList.add("star");

    star.style.top = Math.random() * window.innerHeight + "px";
    star.style.left = Math.random() * window.innerWidth + "px";

    document.body.appendChild(star);
}
</script>

<!-- 🔥 INI YANG HANDLE MUSIC (DARI FILE LU) -->
<script src="assets/sound.js"></script>

</body>
</html>
