<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPO Explorer</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at bottom left, #0b2a4a, #061a33 70%);
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* TEXT */
.text {
    position: absolute;
    top: 25%;
    left: 8%;
}

/* ANIMASI */
@keyframes slideLeft {
    from { opacity: 0; transform: translateX(-60px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.small {
    opacity: 0;
    animation: fadeUp 1s forwards;
}

h1 {
    font-size: 70px;
    margin: 10px 0;
    opacity: 0;
    animation: slideLeft 1s forwards;
    animation-delay: 0.3s;
}

.desc {
    opacity: 0;
    animation: fadeUp 1s forwards;
    animation-delay: 0.6s;
}

/* TOMBOL FIX TENGAH */
.center {
    position: absolute;
    top: 75%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.btn {
    padding: 15px 50px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg, #7b5cff, #5fd0ff);
    color: white;
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 1s forwards;
    animation-delay: 1s;
    box-shadow: 0 0 25px rgba(123,92,255,0.8);
}

.btn:hover {
    transform: scale(1.1);
}

/* ICON */
.laptop {
    position: absolute;
    right: 12%;
    top: 18%;
    font-size: 120px;
    animation: float1 6s ease-in-out infinite;
}

.keyboard {
    position: absolute;
    right: 4%;
    top: 55%;
    font-size: 90px;
    animation: float2 7s ease-in-out infinite;
}

@keyframes float1 {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

@keyframes float2 {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* BINTANG */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: blink 2s infinite alternate;
}

@keyframes blink {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* CREDIT */
.credit {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="text">
    <div class="small">MEDIA PEMBELAJARAN INTERAKTIF</div>
    <h1>IPO<br>EXPLORER</h1>
    <div class="desc">EKSPLORASI ALUR INPUT, PROSES, DAN OUTPUT</div>
</div>

<div class="center">
    <button class="btn" onclick="mulai()">Mulai</button>
</div>

<div class="laptop">💻</div>
<div class="keyboard">⌨️</div>

<div class="credit">By Raehan</div>

<script>
function mulai() {
    window.location.href = "menu.html";
}

// bintang
for (let i = 0; i < 50; i++) {
    let star = document.createElement("div");
    star.classList.add("star");

    star.style.top = Math.random() * window.innerHeight + "px";
    star.style.left = Math.random() * window.innerWidth + "px";

    document.body.appendChild(star);
}
</script>

</body>
</html>
