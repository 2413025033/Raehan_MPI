<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uji Pemahaman</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at bottom left,#0b2a4a,#061a33 70%);
    color:white;
    height:100vh;
    overflow:hidden;
    position:relative;
}

/* BUTTON ATAS */
.top-btn{
    position:absolute;
    top:20px;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    color:white;
    font-size:18px;
    box-shadow:0 0 15px rgba(0,200,255,0.2);
    transition:.2s;
    z-index:999;
}

.top-btn:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,0.15);
}

.back{ left:20px; }
.sound{ right:20px; }

/* ANIMASI */
@keyframes slideDown{
    from{opacity:0; transform:translateY(-25px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

@keyframes blink{
    from{opacity:.3;}
    to{opacity:1;}
}

/* TITLE */
.title{
    position:absolute;
    top:50px;
    width:100%;
    text-align:center;
    font-size:34px;
    font-weight:700;
    letter-spacing:1px;
    opacity:0;
    animation:slideDown 1s forwards;
}

/* DESC */
.desc{
    position:absolute;
    top:145px;
    width:100%;
    text-align:center;
    font-size:14px;
    line-height:1.8;
    opacity:0;
    animation:fadeUp 1s forwards;
    animation-delay:.4s;
}

/* BUTTON TENGAH */
.center{
    position:absolute;
    top:58%;
    left:50%;
    transform:translate(-50%,-50%);
}

.btn{
    padding:13px 38px;
    border-radius:30px;
    border:none;
    background:linear-gradient(45deg,#7b5cff,#5fd0ff);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    opacity:0;
    animation:fadeUp 1s forwards;
    animation-delay:.8s;
    box-shadow:0 0 25px rgba(123,92,255,.8);
    transition:.3s;
}

.btn:hover{
    transform:scale(1.08);
}

/* TEXT BAWAH */
.bottom{
    position:absolute;
    bottom:35px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:.9;
}

/* BUBBLE */
.bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:float 5s ease-in-out infinite;
    box-shadow:inset 0 0 15px rgba(255,255,255,.1), 0 0 15px rgba(95,208,255,.2);
}

.bubble span{ font-size:38px; }

/* POSISI */
.b1{ width:120px; height:120px; left:45px; top:250px; }
.b2{ width:80px; height:80px; left:210px; top:420px; animation-delay:1s; }
.b3{ width:95px; height:95px; right:220px; top:260px; animation-delay:1.5s; }
.b4{ width:135px; height:135px; right:55px; top:400px; animation-delay:2s; }

/* STAR */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

.plus{
    position:absolute;
    color:white;
    font-size:20px;
    animation:blink 2s infinite alternate;
}

</style>
</head>

<body>

<!-- BUTTON -->
<div class="top-btn back" onclick="goBack()">⬅</div>

<div class="top-btn sound" onclick="toggleSound()" id="btnSound">
    ♪
</div>

<!-- TITLE -->
<div class="title">UJI PEMAHAMAN</div>

<!-- DESC -->
<div class="desc">
    Yuk, kita tes pengetahuanmu tentang alur cara kerja komputer.<br>
    Klik tombol di bawah untuk mulai kuisnya!
</div>

<!-- BUTTON -->
<div class="center">
    <button class="btn" onclick="mulaiKuis()">
        Mulai Kuis Sekarang
    </button>
</div>

<!-- TEXT -->
<div class="bottom">
    Coba sekarang dan lihat seberapa paham kamu!
</div>

<!-- BUBBLE -->
<div class="bubble b1"><span>🖥️</span></div>
<div class="bubble b2"><span>💿</span></div>
<div class="bubble b3"><span>🎮</span></div>
<div class="bubble b4"><span>⌨️</span></div>

<script>

/* NAVIGASI */
function mulaiKuis(){
    window.location.href="soal_satu.html";
}

function goBack(){
    window.location.href="menu.html";
}

/* STAR */
for(let i=0;i<50;i++){
    let star=document.createElement("div");
    star.classList.add("star");
    star.style.top=Math.random()*window.innerHeight+"px";
    star.style.left=Math.random()*window.innerWidth+"px";
    document.body.appendChild(star);
}

/* PLUS */
for(let i=0;i<10;i++){
    let plus=document.createElement("div");
    plus.classList.add("plus");
    plus.innerHTML="✦";
    plus.style.top=Math.random()*window.innerHeight+"px";
    plus.style.left=Math.random()*window.innerWidth+"px";
    document.body.appendChild(plus);
}

</script>

<!-- 🔊 GLOBAL SOUND -->
<script src="assets/sound.js"></script>

</body>
</html>
