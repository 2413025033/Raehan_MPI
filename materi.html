<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Materi</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:'Poppins',sans-serif;
color:white;
overflow:hidden;
}

/* BACKGROUND */
.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle at bottom,#0b2a4a,#061a33);
z-index:-2;
}

/* ORB */
.orb{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(0,200,255,.08);
filter:blur(10px);
animation:floatSmooth 6s ease-in-out infinite;
z-index:-1;
}

.o1{top:18%;left:10%;}
.o2{top:65%;right:15%;animation-delay:2s;}
.o3{top:80%;left:45%;animation-delay:4s;}

@keyframes floatSmooth{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* STAR */
.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:blink 2s infinite alternate;
z-index:-1;
}

@keyframes blink{
from{opacity:.2;}
to{opacity:1;}
}

/* HEADER */
header{
text-align:center;
margin-top:60px;
font-size:32px;
font-weight:700;
letter-spacing:2px;
animation:floatSmooth 4s ease-in-out infinite;
text-shadow:0 0 10px rgba(95,208,255,.4);
}

/* TOP BUTTON */
.top-btn{
position:absolute;
top:20px;
width:45px;
height:45px;
display:flex;
justify-content:center;
align-items:center;
border-radius:12px;
cursor:pointer;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
font-size:18px;
color:white;
box-shadow:0 0 15px rgba(0,200,255,.2);
}

.top-btn:hover{transform:scale(1.08);}
.back{left:20px;}
.sound{right:20px;}

/* CONTAINER */
.container{
position:relative;
width:100%;
height:75vh;
}

/* BUBBLE */
.bubble{
width:150px;
height:150px;
border-radius:50%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
display:flex;
justify-content:center;
align-items:center;
position:absolute;
cursor:pointer;
animation:floatSmooth 6s ease-in-out infinite;
box-shadow:inset 0 0 20px rgba(255,255,255,.2),0 0 20px rgba(0,200,255,.3);
transition:.3s;
}

.bubble:hover{transform:scale(1.08);}

.icon{font-size:46px;}

.bubble span{
position:absolute;
bottom:-38px;
font-size:15px;
text-decoration:underline;
}

/* POSISI */
.b1{top:120px;left:20%;}
.b2{top:120px;right:20%;}
.b3{top:330px;left:30%;}
.b4{top:330px;right:30%;}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="top-btn back" onclick="goBack()">⬅</div>
<div class="top-btn sound" onclick="toggleSound()">♪</div>

<header>Pilih Materi</header>

<div class="container">
<div class="bubble b1" onclick="location.href='pengertian_input.html'">
<div class="icon">⌨️</div><span>Input</span>
</div>

<div class="bubble b2" onclick="location.href='pengertian_proses.html'">
<div class="icon">⚙️</div><span>Proses</span>
</div>

<div class="bubble b3" onclick="location.href='pengertian_output.html'">
<div class="icon">🖥️</div><span>Output</span>
</div>

<div class="bubble b4" onclick="location.href='alur_input.html'">
<div class="icon">🔄</div><span>Alur Kerja</span>
</div>
</div>

<script>
function goBack(){
window.location.href="menu.html";
}

for(let i=0;i<50;i++){
let star=document.createElement("div");
star.classList.add("star");
star.style.top=Math.random()*window.innerHeight+"px";
star.style.left=Math.random()*window.innerWidth+"px";
document.body.appendChild(star);
}
</script>

<script src="assets/sound.js"></script>

</body>
</html>
